name: Deploy PHP to ProFreeHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Generate config/local.php from secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          if [ -n "$DB_HOST" ] && [ -n "$DB_NAME" ] && [ -n "$DB_USER" ]; then
            php -r '
              $config = [
                  "db_host" => getenv("DB_HOST"),
                  "db_name" => getenv("DB_NAME"),
                  "db_user" => getenv("DB_USER"),
                  "db_pass" => getenv("DB_PASS"),
              ];
              file_put_contents("config/local.php", "<?php\nreturn " . var_export($config, true) . ";\n");
              echo "config/local.php generated.\n";
            '
          else
            echo "DB_HOST / DB_NAME / DB_USER secrets not set - skipping config/local.php generation."
          fi

      - name: Deploy to ProFreeHost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          server-dir: htdocs/
